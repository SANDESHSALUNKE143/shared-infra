groups:
  - name: shared-infra
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is down"
      - alert: LogQueueDepthHigh
        expr: log_queue_depth > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: The application log queue has more than 1000 messages
      - alert: HostDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|aufs",mountpoint!~"/var/lib/docker.*"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|aufs",mountpoint!~"/var/lib/docker.*"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Filesystem {{ $labels.mountpoint }} is over 85 percent full
      - alert: ElasticsearchClusterYellow
        expr: elasticsearch_cluster_health_status{color="yellow"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elasticsearch cluster health is yellow
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Elasticsearch cluster health is red
