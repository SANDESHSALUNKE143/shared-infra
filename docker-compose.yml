# One VM per environment. Start with scripts/up.sh so .env is rendered first.
# Unauthenticated ports bind to 127.0.0.1. UIs with a login publish on the host.

name: shared-infra

x-logging: &json-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST}:3000
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 2g
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/targets.yml:/etc/prometheus/targets.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 128m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 128m
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 4g
    environment:
      discovery.type: single-node
      cluster.name: shared-infra
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    restart: "no"
    logging: *json-logs
    user: "0"
    entrypoint: ["/bin/bash", "/elasticsearch/init.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      LOGS_WRITER_PASSWORD: ${LOGS_WRITER_PASSWORD}
      LOGS_READER_PASSWORD: ${LOGS_READER_PASSWORD}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
    volumes:
      - ./elasticsearch:/elasticsearch:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 1g
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
      SERVER_PUBLICBASEURL: http://${PUBLIC_HOST}:5601
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '200|401'",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  kibana-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    restart: "no"
    logging: *json-logs
    user: "0"
    entrypoint: ["/bin/bash", "/elasticsearch/kibana-init.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    volumes:
      - ./elasticsearch:/elasticsearch:ro
    depends_on:
      kibana:
        condition: service_healthy

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 128m
    command:
      - --es.uri=http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 1g
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  otel-collector:
    image: otel/opentelemetry-collector:0.128.0
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 256m
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      LANGFUSE_OTLP_AUTH_HEADER: ${LANGFUSE_OTLP_AUTH_HEADER}
    ports:
      - "4317:4317"
      - "4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./otel/otel-collector.yaml:/etc/otel/config.yaml:ro

  log-worker:
    profiles: ["worker"]
    build: ./log-worker
    image: shared-infra-log-worker:local
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 512m
    environment:
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      AZURE_QUEUE_NAME: ${AZURE_QUEUE_NAME:-app-logs}
      AZURE_POISON_QUEUE_NAME: ${AZURE_POISON_QUEUE_NAME:-app-logs-poison}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: logs_writer
      ELASTICSEARCH_PASSWORD: ${LOGS_WRITER_PASSWORD}
      BATCH_SIZE: "32"
      BATCH_WAIT_SECONDS: "2"
      VISIBILITY_TIMEOUT: "30"
      POISON_AFTER: "5"
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 1g
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "3003:3000"
    environment: &langfuse-env
      NEXTAUTH_URL: http://${PUBLIC_HOST}:3003
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:${CLICKHOUSE_PASSWORD}@clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_INIT_ORG_ID: shared-infra
      LANGFUSE_INIT_ORG_NAME: Shared Infra
      LANGFUSE_INIT_PROJECT_ID: shared-infra
      LANGFUSE_INIT_PROJECT_NAME: Shared Infra
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-ops@localhost}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-Ops}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 1g
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment: *langfuse-env

  langfuse-postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 4g
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  langfuse-redis:
    image: redis:7
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 256m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 512m
    entrypoint: ["sh"]
    command: ["-c", "mkdir -p /data/langfuse && minio server --address \":9000\" --console-address \":9001\" /data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 512m
    environment:
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD}
      MLFLOW_AUTH_CONFIG_PATH: /mlflow/basic_auth.ini
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SECRET}
    entrypoint: ["sh", "-c"]
    command:
      - |
        cat > /mlflow/basic_auth.ini << EOF
        [mlflow]
        default_permission = READ
        database_uri = sqlite:////mlflow/basic_auth.db
        admin_username = ${MLFLOW_ADMIN_USER:-admin}
        admin_password = $$MLFLOW_ADMIN_PASSWORD
        authorization_function = mlflow.server.auth:authenticate_request_basic_auth
        EOF
        exec mlflow server --app-name basic-auth --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  n8n:
    image: n8nio/n8n:1.90.2
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 1g
    environment:
      N8N_HOST: ${PUBLIC_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://${PUBLIC_HOST}:5678
      WEBHOOK_URL: http://${PUBLIC_HOST}:5678
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_EXECUTIONS_DATA_PRUNE: "true"
      N8N_EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_DATA_MAX_AGE:-168}
      GENERIC_TIMEZONE: UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 1g
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  neo4j:
    image: neo4j:5.26.4
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 1g
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  sql:
    image: postgres:16
    restart: unless-stopped
    logging: *json-logs
    mem_limit: 512m
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
      POSTGRES_DB: agentic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  elasticsearch-data:
  loki-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-redis-data:
  langfuse-minio-data:
  mlflow-data:
  n8n-data:
  qdrant-data:
  neo4j-data:
  sql-data:
